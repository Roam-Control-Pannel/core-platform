name: CI

# "No green, no merge" — every push and PR runs the full check suite.
# This makes the commit-chain discipline a guarantee, not a habit.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile fails if pnpm-lock.yaml is out of sync with package.json,
      # which catches a committed dependency change that forgot to update the lock.
      # esbuild's build script is pre-approved via onlyBuiltDependencies in
      # pnpm-workspace.yaml, so no interactive approve-builds step is needed in CI.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Lint runs first: it is the cheapest gate (~seconds) and catches the
      # most common errors, so it gives the fastest red signal. Every workspace
      # lints through the shared @roam/eslint-config presets and one eslint binary.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  # Database gate — executes the SQL that `check` never touches. Spins up the
  # Supabase local Postgres, applies EVERY migration + the dev seed via
  # `db reset` (so a broken migration fails here, not at deploy), then runs the
  # pgTAP suite in supabase/tests/ (RLS policies, triggers, RPCs). Local-only
  # CLI commands — no SUPABASE_ACCESS_TOKEN or project secrets required.
  db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Starts only the Postgres container (not the full stack), so no auth/
      # storage/studio services and none of their env() secrets are needed.
      #
      # RETRIED, because ghcr.io intermittently sheds load with `toomanyrequests` and
      # that aborts the WHOLE image pull — even when almost every layer has already
      # downloaded. Docker keeps the layers it did fetch, so each attempt resumes
      # further along rather than starting over; retrying is mechanically likely to
      # finish the pull, not merely hopeful.
      #
      # This is a deploy gate, not just a badge: Railway only deploys a commit whose
      # check suite passed, so a registry hiccup here silently blocks production. On
      # 2026-09-23 three consecutive runs (two on a PR, one on main) died on this
      # step and skipped the production deploy.
      #
      # Deliberately bounded: five attempts with linear backoff, then a real failure.
      # A genuinely broken migration must still fail this job promptly — this retries
      # the image pull, it does not paper over SQL.
      - name: Start local Postgres
        run: |
          for attempt in 1 2 3 4 5; do
            if supabase db start; then
              exit 0
            fi
            if [ "${attempt}" -eq 5 ]; then break; fi
            delay=$((attempt * 15))
            echo "::warning::supabase db start failed (attempt ${attempt}/5) — retrying in ${delay}s"
            sleep "${delay}"
          done
          echo "::error::supabase db start failed after 5 attempts"
          exit 1

      # Re-applies all migrations + seed.sql from scratch; fails the job on any
      # migration error, ordering problem, or seed breakage.
      - name: Apply migrations + seed (db reset)
        run: supabase db reset

      # pgTAP assertions over the freshly-migrated schema.
      - name: Run pgTAP tests
        run: supabase test db --local
