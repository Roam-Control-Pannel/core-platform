name: DB migrate

# Applies pending Supabase migrations to the LIVE project and reloads the PostgREST schema cache —
# the step that was missing when the F2G storefront blacked out (migration 0134 merged to the repo
# and passed the CI `db` gate, but was never applied to the live DB the deployed app reads).
#
# Runs on every push to main (so schema leads code) and on demand. It is OPT-IN and SAFE: with the
# required secrets unset it no-ops (a fork PR or an unconfigured repo is never affected). Configure it
# by adding the repo secrets below; to enforce ordering (migrate before the app deploys) also disable
# your host's auto-deploy and trigger the deploy after this workflow. See docs/db-release-runbook.md.
#
# Required secrets to activate:
#   SUPABASE_ACCESS_TOKEN  — a Supabase CLI access token (account/personal token)
#   SUPABASE_PROJECT_REF   — the target project ref (e.g. kyancopdkxotzzkzqsmf)
#   SUPABASE_DB_PASSWORD   — the project's database password (for `db push`)
#   SUPABASE_DB_URL        — (optional) full Postgres connection string, used to NOTIFY a cache reload

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: db-migrate-${{ github.ref }}
  cancel-in-progress: false # never interrupt a migration mid-flight

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Secrets can't gate a job-level `if`, so decide here and gate the real steps on the output.
      - name: Check configuration
        id: guard
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$REF" ]; then
            echo "SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF not set — skipping (not configured)."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Supabase CLI
        if: steps.guard.outputs.configured == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        if: steps.guard.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      # Applies every migration not yet recorded on the project. Idempotent migrations (the repo's
      # `add ... if not exists` style) make a re-run safe even where the ledger under-reports.
      # `db push` reads the DB password from SUPABASE_DB_PASSWORD.
      - name: Apply migrations
        if: steps.guard.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push

      # Reload PostgREST's schema cache so newly-added columns are readable immediately (Supabase
      # usually auto-reloads on DDL, but this makes it deterministic — the missing half of the fix).
      # Guarded inside the step because the `secrets` context isn't usable in a step `if:`.
      - name: Reload PostgREST schema cache
        if: steps.guard.outputs.configured == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "SUPABASE_DB_URL not set — relying on Supabase's auto-reload on DDL."
            echo "For a deterministic reload, add SUPABASE_DB_URL (a full Postgres connection string)."
            exit 0
          fi
          psql "$SUPABASE_DB_URL" -c "notify pgrst, 'reload schema';"
